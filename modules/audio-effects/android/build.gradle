apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'expo.modules.audioeffects'
version = '1.0.0'

buildscript {
  def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
  if (expoModulesCorePlugin.exists()) {
    apply from: expoModulesCorePlugin
    applyKotlinExpoModulesCorePlugin()
  }
}

afterEvaluate {
  publishing {
    publications {
      release(MavenPublication) {
        from components.release
      }
    }
    repositories {
      maven {
        url = mavenLocal().url
      }
    }
  }
}

android {
  namespace "expo.modules.audioeffects"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 23)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
    
    externalNativeBuild {
      cmake {
        cppFlags "-O3 -ffast-math"
        abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
      }
    }
  }
  
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.18.0+"
    }
  }
  
  ndkVersion safeExtGet("ndkVersion", "29.0.13113456")

  publishing {
    singleVariant("release") {
      withSourcesJar()
    }
  }

  lintOptions {
    abortOnError false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_17.majorVersion
  }
}

repositories {
  mavenCentral()
  google()
}

android.aaptOptions {
  noCompress "tflite"
}

dependencies {
  implementation project(':expo-modules-core')
  
  // ExoPlayer (Media3) for native audio playback
  implementation 'androidx.media3:media3-exoplayer:1.2.1'
  implementation 'androidx.media3:media3-common:1.2.1'
  implementation 'androidx.media3:media3-session:1.2.1'
  
  // Google Play Billing for license verification (v8+ required by Google Play)
  implementation 'com.android.billingclient:billing-ktx:8.0.0'
  
  // Security for encrypted storage
  implementation 'androidx.security:security-crypto:1.1.0-alpha06'
  
  // LiteRT (successor to TensorFlow Lite) for neural audio processing
  // LiteRT 1.x maintains Interpreter API compatibility while supporting 16KB page sizes
  implementation 'com.google.ai.edge.litert:litert:1.4.1'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
