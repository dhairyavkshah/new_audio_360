<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Audio 360 - Streaming Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 10px; font-size: 24px; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 30px; }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 16px;
      margin-bottom: 20px;
    }
    .search-box::placeholder { color: #8892b0; }
    .song-list { list-style: none; }
    .song-item {
      display: flex;
      align-items: center;
      padding: 16px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .song-item:hover { background: rgba(255,255,255,0.1); transform: translateX(4px); }
    .song-item.playing { background: rgba(0, 191, 165, 0.2); border: 1px solid #00BFA5; }
    .song-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #00BFA5 0%, #1565C0 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 16px;
      font-size: 20px;
    }
    .song-info { flex: 1; }
    .song-title { font-weight: 600; margin-bottom: 4px; }
    .song-artist { color: #8892b0; font-size: 14px; }
    .song-meta { display: flex; gap: 8px; margin-top: 4px; }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
    }
    .badge.stream { background: #00BFA5; color: #fff; }
    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #00BFA5;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loading { text-align: center; padding: 40px; color: #8892b0; }
    .error { text-align: center; padding: 20px; color: #ff5252; background: rgba(255,82,82,0.1); border-radius: 8px; margin-bottom: 20px; }
    .now-playing {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1a2e;
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: none;
    }
    .now-playing.active { display: flex; align-items: center; gap: 16px; }
    .now-playing-info { flex: 1; }
    .now-playing-title { font-weight: 600; }
    .now-playing-artist { color: #8892b0; font-size: 14px; }
    audio { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>New Audio 360</h1>
    <p class="subtitle">Online Music Streaming Test</p>
    
    <input type="text" class="search-box" id="searchBox" placeholder="Search songs or artists...">
    
    <div id="error" class="error" style="display: none;"></div>
    <div id="loading" class="loading">Loading songs...</div>
    <ul id="songList" class="song-list"></ul>
  </div>
  
  <div id="nowPlaying" class="now-playing">
    <div class="now-playing-info">
      <div id="npTitle" class="now-playing-title">-</div>
      <div id="npArtist" class="now-playing-artist">-</div>
    </div>
    <button class="play-btn" id="npPlayBtn" onclick="togglePlay()">⏸</button>
  </div>
  
  <audio id="audioPlayer"></audio>
  
  <script>
    const API_BASE = window.location.origin;
    let songs = [];
    let currentSong = null;
    const audio = document.getElementById('audioPlayer');
    
    async function loadSongs() {
      try {
        const res = await fetch(`${API_BASE}/api/streaming/songs`);
        if (!res.ok) throw new Error('Failed to load');
        const data = await res.json();
        songs = data.songs;
        renderSongs(songs);
        document.getElementById('loading').style.display = 'none';
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = 'Failed to connect to streaming API. Make sure the server is running.';
        document.getElementById('error').style.display = 'block';
      }
    }
    
    async function searchSongs(query) {
      if (!query.trim()) {
        renderSongs(songs);
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/streaming/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        renderSongs(data.songs);
      } catch (err) {
        console.error('Search error:', err);
      }
    }
    
    function renderSongs(list) {
      const container = document.getElementById('songList');
      container.innerHTML = list.map(song => `
        <li class="song-item ${currentSong?.id === song.id ? 'playing' : ''}" onclick="playSong(${song.id})">
          <div class="song-icon">🎵</div>
          <div class="song-info">
            <div class="song-title">${song.title}</div>
            <div class="song-artist">${song.artist}${song.album ? ' • ' + song.album : ''}</div>
            <div class="song-meta">
              <span class="badge">${formatDuration(song.duration)}</span>
              ${song.genre ? `<span class="badge">${song.genre}</span>` : ''}
              <span class="badge stream">☁ Stream</span>
            </div>
          </div>
          <button class="play-btn">${currentSong?.id === song.id ? '⏸' : '▶'}</button>
        </li>
      `).join('');
    }
    
    function formatDuration(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }
    
    function playSong(id) {
      const song = songs.find(s => s.id === id);
      if (!song) return;
      
      if (currentSong?.id === id) {
        togglePlay();
        return;
      }
      
      currentSong = song;
      audio.src = song.stream_url;
      audio.play();
      
      document.getElementById('npTitle').textContent = song.title;
      document.getElementById('npArtist').textContent = song.artist;
      document.getElementById('nowPlaying').classList.add('active');
      document.getElementById('npPlayBtn').textContent = '⏸';
      
      renderSongs(songs);
    }
    
    function togglePlay() {
      if (audio.paused) {
        audio.play();
        document.getElementById('npPlayBtn').textContent = '⏸';
      } else {
        audio.pause();
        document.getElementById('npPlayBtn').textContent = '▶';
      }
      renderSongs(songs);
    }
    
    audio.onended = () => {
      currentSong = null;
      document.getElementById('nowPlaying').classList.remove('active');
      renderSongs(songs);
    };
    
    document.getElementById('searchBox').addEventListener('input', (e) => {
      searchSongs(e.target.value);
    });
    
    loadSongs();
  </script>
</body>
</html>
