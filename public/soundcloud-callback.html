<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundCloud Authorization</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      max-width: 400px;
      width: 90%;
    }
    .icon {
      width: 80px; height: 80px;
      margin: 0 auto 24px;
      background: #4CAF50;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .icon svg { width: 48px; height: 48px; fill: white; }
    .error-icon { background: #f44336; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 16px; color: rgba(255,255,255,0.7); line-height: 1.5; }
    .code-box {
      margin-top: 20px;
      padding: 16px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
      text-align: left;
    }
    .copy-btn {
      margin-top: 16px;
      padding: 12px 24px;
      background: #FF5500;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .copy-btn:hover { background: #e64d00; }
    .instruction { margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="success" class="icon">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    </div>
    <div id="error" class="icon error-icon" style="display:none;">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </div>
    <h1 id="title">Authorization Successful!</h1>
    <p id="message">Copy the code below and paste it in the app to complete sign-in.</p>
    <div id="codeBox" class="code-box"></div>
    <button id="copyBtn" class="copy-btn" onclick="copyCode()">Copy Code</button>
    <p class="instruction">After copying, close this window and paste the code in the app.</p>
  </div>
  <script>
    var authCode = '';
    
    function copyCode() {
      navigator.clipboard.writeText(authCode).then(function() {
        document.getElementById('copyBtn').textContent = 'Copied!';
        setTimeout(function() {
          document.getElementById('copyBtn').textContent = 'Copy Code';
        }, 2000);
      });
    }
    
    (function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var state = params.get('state');
      var error = params.get('error');
      var errorDesc = params.get('error_description');

      var successIcon = document.getElementById('success');
      var errorIcon = document.getElementById('error');
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var codeBox = document.getElementById('codeBox');
      var copyBtn = document.getElementById('copyBtn');

      if (error) {
        successIcon.style.display = 'none';
        errorIcon.style.display = 'flex';
        title.textContent = 'Authorization Failed';
        message.textContent = errorDesc || error;
        codeBox.style.display = 'none';
        copyBtn.style.display = 'none';
        return;
      }

      if (!code) {
        successIcon.style.display = 'none';
        errorIcon.style.display = 'flex';
        title.textContent = 'Authorization Failed';
        message.textContent = 'No authorization code received.';
        codeBox.style.display = 'none';
        copyBtn.style.display = 'none';
        return;
      }

      authCode = code + '|' + (state || '');
      codeBox.textContent = authCode;
      
      try {
        localStorage.setItem('soundcloud_oauth_result', JSON.stringify({
          type: 'soundcloud_oauth_callback',
          url: window.location.href,
          code: code,
          state: state,
          timestamp: Date.now()
        }));
      } catch (e) {}
      
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: 'oauth_callback',
            url: window.location.href,
            code: code,
            state: state
          }, '*');
        } catch (e) {}
      }
    })();
  </script>
</body>
</html>
