<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundCloud Authorization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      max-width: 400px;
      width: 90%;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #FF5500;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .icon svg {
      width: 48px;
      height: 48px;
      fill: white;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FF5500;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
    }
    .success-icon {
      background: #4CAF50;
    }
    .error-icon {
      background: #f44336;
    }
    .hidden {
      display: none;
    }
    .close-btn {
      margin-top: 20px;
      padding: 12px 24px;
      background: #FF5500;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .close-btn:hover {
      background: #e64d00;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading" class="icon">
      <div class="spinner"></div>
    </div>
    <div id="success" class="icon success-icon hidden">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    </div>
    <div id="error" class="icon error-icon hidden">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </div>
    <h1 id="title">Completing sign-in...</h1>
    <p id="message">Please wait while we connect your SoundCloud account.</p>
    <button id="closeBtn" class="close-btn hidden" onclick="window.close()">Close Window</button>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var state = params.get('state');
      var error = params.get('error');
      var errorDesc = params.get('error_description');

      var loadingIcon = document.getElementById('loading');
      var successIcon = document.getElementById('success');
      var errorIcon = document.getElementById('error');
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var closeBtn = document.getElementById('closeBtn');

      console.log('[OAuth Callback] Received params:', { code: code ? 'present' : 'missing', state: state, error: error });

      function showSuccess() {
        loadingIcon.classList.add('hidden');
        successIcon.classList.remove('hidden');
        title.textContent = 'Connected!';
        message.textContent = 'Your SoundCloud account is now connected. This window will close automatically.';
        closeBtn.classList.remove('hidden');
      }

      function showError(msg) {
        loadingIcon.classList.add('hidden');
        errorIcon.classList.remove('hidden');
        title.textContent = 'Connection Failed';
        message.textContent = msg || 'Unable to connect your SoundCloud account. Please try again.';
        closeBtn.classList.remove('hidden');
      }

      if (error) {
        console.log('[OAuth Callback] Error received:', error, errorDesc);
        showError(errorDesc || error);
        return;
      }

      if (!code) {
        console.log('[OAuth Callback] No code received');
        showError('No authorization code received.');
        return;
      }

      var fullUrl = window.location.href;
      console.log('[OAuth Callback] Full URL:', fullUrl);
      console.log('[OAuth Callback] Has opener:', !!window.opener);

      function tryPostMessage() {
        var messageData = {
          type: 'oauth_callback',
          url: fullUrl,
          code: code,
          state: state
        };
        
        console.log('[OAuth Callback] Sending postMessage:', messageData);
        
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(messageData, '*');
            console.log('[OAuth Callback] postMessage sent successfully');
            showSuccess();
            setTimeout(function() {
              window.close();
            }, 2000);
          } catch (e) {
            console.error('[OAuth Callback] postMessage failed:', e);
            showSuccess();
            message.textContent = 'Connected! Please close this window and return to New Audio 360.';
          }
        } else {
          console.log('[OAuth Callback] No opener window available');
          showSuccess();
          message.textContent = 'Connected! Please close this window and return to New Audio 360.';
        }
      }

      tryPostMessage();
    })();
  </script>
</body>
</html>
