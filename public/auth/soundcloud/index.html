<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundCloud Authorization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      max-width: 400px;
      width: 90%;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #FF5500;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .icon svg {
      width: 48px;
      height: 48px;
      fill: white;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FF5500;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
    }
    .success-icon {
      background: #4CAF50;
    }
    .error-icon {
      background: #f44336;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading" class="icon">
      <div class="spinner"></div>
    </div>
    <div id="success" class="icon success-icon hidden">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    </div>
    <div id="error" class="icon error-icon hidden">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </div>
    <h1 id="title">Completing sign-in...</h1>
    <p id="message">Please wait while we connect your SoundCloud account.</p>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const errorDesc = params.get('error_description');

      const loadingIcon = document.getElementById('loading');
      const successIcon = document.getElementById('success');
      const errorIcon = document.getElementById('error');
      const title = document.getElementById('title');
      const message = document.getElementById('message');

      function showSuccess() {
        loadingIcon.classList.add('hidden');
        successIcon.classList.remove('hidden');
        title.textContent = 'Connected!';
        message.textContent = 'Your SoundCloud account is now connected. This window will close automatically.';
      }

      function showError(msg) {
        loadingIcon.classList.add('hidden');
        errorIcon.classList.remove('hidden');
        title.textContent = 'Connection Failed';
        message.textContent = msg || 'Unable to connect your SoundCloud account. Please try again.';
      }

      if (error) {
        showError(errorDesc || error);
        return;
      }

      if (!code) {
        showError('No authorization code received.');
        return;
      }

      const fullUrl = window.location.href;

      if (window.opener) {
        try {
          window.opener.postMessage({
            type: 'oauth_callback',
            url: fullUrl,
            code: code,
            state: state
          }, '*');
          showSuccess();
          setTimeout(function() {
            window.close();
          }, 1500);
        } catch (e) {
          showError('Unable to communicate with the main window.');
        }
      } else {
        showSuccess();
        message.textContent = 'Authorization successful! You can close this window and return to New Audio 360.';
      }
    })();
  </script>
</body>
</html>
