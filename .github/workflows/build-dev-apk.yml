name: Build Developer APK (No Google Play License Check)

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Build message'
        required: false
        default: 'Developer testing build'
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Standalone Developer APK
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS Secrets
        run: |
          eas env:create --name SOUNDCLOUD_CLIENT_ID --value "${{ secrets.SOUNDCLOUD_CLIENT_ID }}" --visibility secret --scope project --environment production --environment preview --environment development --force --non-interactive
          eas env:create --name SOUNDCLOUD_CLIENT_SECRET --value "${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}" --visibility secret --scope project --environment production --environment preview --environment development --force --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Standalone Developer APK
        run: eas build --platform android --profile testing --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Complete
        run: |
          echo "================================================"
          echo "Developer APK build submitted to EAS!"
          echo "================================================"
          echo ""
          echo "This is a standalone testing APK without the Google Play license check."
          echo "Production APK/AAB builds still enforce Google Play installation verification."
          echo ""
          echo "Download from:"
          echo "https://expo.dev/accounts/shahdhairyavk/projects/new-audio-360/builds"
          echo "================================================"
