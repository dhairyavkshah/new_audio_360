name: Build Production APK (Direct Install)

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Release message'
        required: false
        default: 'Production APK release'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Signed Production APK
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS Secrets
        run: |
          eas secret:create --scope project --name SOUNDCLOUD_CLIENT_ID --value "${{ secrets.SOUNDCLOUD_CLIENT_ID }}" --force
          eas secret:create --scope project --name SOUNDCLOUD_CLIENT_SECRET --value "${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}" --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Signed Production APK
        run: eas build --platform android --profile production-apk --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Complete
        run: |
          echo "================================================"
          echo "Production APK build submitted to EAS!"
          echo "================================================"
          echo ""
          echo "Download your signed APK from:"
          echo "https://expo.dev/accounts/shahdhairyavk/projects/new-audio-360/builds"
          echo ""
          echo "This APK can be installed directly on devices"
          echo "or distributed outside the Play Store."
          echo "================================================"
