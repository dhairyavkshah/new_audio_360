name: Build Windows Store Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 26.0.0)'
        required: true
        default: '26.0.0'

env:
  NODE_VERSION: '20'
  APP_NAME: 'New Audio 360'

jobs:
  build-web:
    name: Build Web Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npx expo export --platform web
        env:
          NODE_ENV: production
          APP_ENV: production

      - name: Copy PWA assets
        run: |
          cp public/manifest.json dist/manifest.json
          cp public/sw.js dist/sw.js
          mkdir -p dist/icons
          cp -r windows/assets/icons/* dist/icons/ 2>/dev/null || true

      - name: Create version info
        run: |
          echo "Version: ${{ github.event.inputs.version }}" > dist/version.txt
          echo "Build Date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> dist/version.txt
          echo "Commit: ${{ github.sha }}" >> dist/version.txt

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.event.inputs.version }}
          path: dist/
          retention-days: 30

      - name: Upload store assets
        uses: actions/upload-artifact@v4
        with:
          name: store-submission-assets-${{ github.event.inputs.version }}
          path: |
            windows/store/
            docs/MICROSOFT_STORE_SUBMISSION.md
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## Build Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps to Create Windows Package:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the **web-build** artifact above" >> $GITHUB_STEP_SUMMARY
          echo "2. Deploy it to a web server (or use GitHub Pages)" >> $GITHUB_STEP_SUMMARY
          echo "3. Go to [PWABuilder.com](https://www.pwabuilder.com)" >> $GITHUB_STEP_SUMMARY
          echo "4. Enter your deployed URL" >> $GITHUB_STEP_SUMMARY
          echo "5. Click **Package for stores** → **Windows**" >> $GITHUB_STEP_SUMMARY
          echo "6. Download the MSIX package" >> $GITHUB_STEP_SUMMARY
          echo "7. Submit to Microsoft Store" >> $GITHUB_STEP_SUMMARY
